<form class="page" [formGroup]="form()" (ngSubmit)="onSubmit()">
  <div class="page__header">
    <span class="page__icon">
      @switch (icon()) {
        @case ('person') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M4.5 20c1.4-3.8 4.4-6 7.5-6s6.1 2.2 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        }
        @case ('heart') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M12 20s-7-4.35-9.5-8.8C.9 7.9 2.4 4.5 5.8 4a4.9 4.9 0 0 1 6.2 2.3A4.9 4.9 0 0 1 18.2 4c3.4.5 4.9 3.9 3.3 7.2C19 15.65 12 20 12 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        }
        @case ('lungs') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M12 3v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M12 11c-1-3-6-3-7 0-1.2 3.7 0 8 2.5 8 1.8 0 2.5-1.3 2.5-3v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 11c1-3 6-3 7 0 1.2 3.7 0 8-2.5 8-1.8 0-2.5-1.3-2.5-3v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M6 3h8l4 4v14H6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M14 3v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        }
      }
    </span>
    <h2 class="page__title">{{ page().title }}</h2>
  </div>

  @for (field of fields(); track field.question.id) {
    <app-question-field
      [question]="field.question"
      [control]="field.control"
      [submitted]="submitAttempted()"
    />
  }

  <div class="page__actions">
    @if (canGoBack()) {
      <button type="button" class="btn btn--secondary" (click)="onBack()" [disabled]="submitting()">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
          <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back
      </button>
    }
    <button type="submit" class="btn btn--primary" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner" aria-hidden="true"></span>
        Submitting…
      } @else {
        Next
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true">
          <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
    </button>
  </div>
</form>
